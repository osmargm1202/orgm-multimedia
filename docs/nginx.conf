# Fragmento para el Nginx ya existente, SOLO si comparte host con la API.
# El túnel existente apunta a http://127.0.0.1:8085 con el Host público.
# Habilitar primero Cloudflare Access y configurar access.env en el backend.
server {
    listen 127.0.0.1:8085;
    server_name home.or-gm.com;
    client_max_body_size 8k;
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host home.or-gm.com;
        proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
        proxy_read_timeout 35s;
    }
}
