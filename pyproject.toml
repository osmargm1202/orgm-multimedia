[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "orgm-multimedia"
version = "0.1.0"
description = "ORGM Home: sesión multimedia Sway y mando web"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "jinja2>=3.1,<4", "PyJWT[crypto]>=2.10,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]

[project.scripts]
orgm-home = "orgm_home.web:main"
orgm-home-agent = "orgm_home.agent:main"
orgm-home-kiosk = "orgm_home.kiosk:main"
orgm-home-display = "orgm_home.display:main"
orgm-home-touch = "orgm_home.touch:main"
orgm-home-control = "orgm_home.touch:control"
orgm-home-reboot = "orgm_home.touch:reboot"
orgm-home-cast = "orgm_home.cast:main"

[tool.setuptools.package-data]
orgm_home = ["templates/*.html", "static/*", "static/fonts/*", "static/icons/*", "static/cards/*", "touch/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
