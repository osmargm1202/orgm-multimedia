<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AirPlay · {{ receiver }}</title>
  <link rel="stylesheet" href="{{ asset('home.css') }}">
</head>
<body class="airplay-screen">
  <main class="airplay-waiting">
    <img class="airplay-mark" src="{{ asset('icons/airplay.svg') }}" alt="">
    <h1>Tu pantalla, en la sala.</h1>
    <p>Conecta tu iPhone, iPad o Mac a la misma red Wi-Fi.</p>
    <ol><li>Abre <strong>Duplicar pantalla</strong> o AirPlay.</li><li>Elige <strong>{{ receiver }}</strong>.</li></ol>
    <div class="receiver-name"><span class="status-dot"></span>{{ receiver }}</div>
    <p class="airplay-note">La imagen aparecerá aquí al conectar. Usa la X de los controles para cerrar el receptor.</p>
  </main>
</body>
</html>
